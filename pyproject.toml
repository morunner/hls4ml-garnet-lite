[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "hls4ml-garnet-lite"
version = "0.1.0"
description = "A lightweight GarNet implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow==2.14.0",
    "qkeras>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.5.0",
    "jinja2>=3.1.6",
    "pytest>=9.0.1",
]

[tool.ruff]
target-version = "py310"

line-length = 125
indent-width = 4

format.quote-style = "single"
format.skip-magic-trailing-comma = false
format.docstring-code-line-length = 125
format.docstring-code-format = true
lint.select = [ "E", "F", "F401", "I", "W" ]
lint.ignore = [ "E741" ]
lint.per-file-ignores = { "__init__.py" = [ "F401" ] }

lint.fixable = [ "ALL" ]
lint.unfixable = [  ]

[tool.pytest.ini_options]
python_files = "test_*.py generate_test_vectors.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["hls4ml_garnet_lite*"]
exclude = ["tests*", "data*"]
namespaces = false

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
hls4ml-garnet-lite = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "hls4ml-garnet-lite",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[tool.setuptools.package-data]
"hls4ml_garnet_lite" = ["**/*.h"]
